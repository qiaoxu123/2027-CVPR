<!doctype html><meta charset="utf-8"><title>原文与精简文本逐条诊断</title><style>body{font:16px sans-serif;margin:20px;max-width:1500px}table{border-collapse:collapse}td,th{border:1px solid #aaa;padding:6px}pre{white-space:pre-wrap;background:#eee;padding:12px}input,button,select{padding:8px;margin:5px}.good{color:green}.bad{color:#b00}</style><h1>7619条TRAIN：原文与精简文本差距</h1><p>训练内拟合诊断；全部GT仅事后评价。切换固定图结构可比较BERT文本修复。完整词测试24条/1145次是事后典型案例，不是随机总体。</p><input id="idx" type="number" min="0" max="7618" value="0"><button id="prev">上一条</button><button id="next">下一条</button><button id="lost">下一条原文成功/精简失败</button><select id="graph"><option>mini</option><option>full</option></select><h2 id="title"></h2><b>原文</b><pre id="original"></pre><b>精简输入</b><pre id="minimal"></pre><b>被单独测试的信息块</b><pre id="blocks"></pre><div id="stats"></div><h3>本条逐词实验（若有）</h3><pre id="word"></pre><img id="fig" style="max-width:100%"><script>let rows,word,figures;const $=x=>document.getElementById(x);function show(){let i=Math.max(0,Math.min(7618,+$('idx').value));$('idx').value=i;let r=rows[i];$('title').textContent=i+' | '+r.episode;$('original').textContent=r.original;$('minimal').textContent=r.minimal;$('blocks').textContent='外观：'+r.attributes+String.fromCharCode(10)+'数量/序数/距离：'+r.quantities+String.fromCharCode(10)+'关系路径：'+r.chain;let g=$('graph').value;let arms=['full','mini','restore_attributes@'+g,'restore_quantities@'+g,'restore_chain@'+g,'restore_all@'+g,'reorder_minimal@'+g,'full_drop_attributes@'+g,'full_drop_quantities@'+g,'full_drop_chain@'+g];let table='<table><tr><th>输入干预</th><th>Top1</th><th>Top20</th><th>GT附近最好排名</th><th>NE</th></tr>';for(let a of arms)table+='<tr><td>'+a+'</td><td>'+r[a+'_hit1']+'</td><td>'+r[a+'_hit20']+'</td><td>'+r[a+'_rank']+'</td><td>'+r[a+'_NE'].toFixed(2)+'</td></tr>';$('stats').innerHTML=table+'</table>';let w=word.find(x=>x.index===i);$('word').textContent=w?JSON.stringify(w,null,1):'本条未做逐词实验；已有8组块级测试。';$('fig').style.display=figures[i]?'block':'none';if(figures[i])$('fig').src=figures[i];}async function load(){[rows,word,figures]=await Promise.all(['per_query.json','word_tests.json','figures.json'].map(x=>fetch(x).then(r=>r.json())));show()}$('idx').onchange=show;$('graph').onchange=show;$('prev').onclick=()=>{$('idx').value=Math.max(0,+$('idx').value-1);show()};$('next').onclick=()=>{$('idx').value=Math.min(7618,+$('idx').value+1);show()};$('lost').onclick=()=>{let start=+$('idx').value;for(let n=1;n<=rows.length;n++){let i=(start+n)%rows.length;if(rows[i].full_hit1&&!rows[i].mini_hit1){$('idx').value=i;show();break}}};load();</script>

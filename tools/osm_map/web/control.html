<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityNav–OSM 控制点标注</title><link rel="stylesheet" href="/vendor/leaflet.css"><style>body{margin:0;font:14px system-ui;background:#18222e;color:#eee}header{padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:6px;border-radius:4px}button{cursor:pointer}.maps{display:flex;height:62vh;position:relative}.pane{width:50%;height:100%}.leaflet-container{background:#bcc1c3}.cp{border:2px solid white;border-radius:50%;background:#1476ba;color:#fff;font:bold 12px system-ui;text-align:center;line-height:22px}.cp.validation{background:#b72d9a}.selected{box-shadow:0 0 0 3px #ffe800}.pending{background:#f58500}.panel{padding:8px 16px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:5px;border:1px solid #52606f}tr:hover{background:#314459}#status{color:#ffd479}#rows{max-height:21vh;overflow:auto}#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:800}a{color:#8cd8ff}#report{white-space:pre-wrap}.small{font-size:12px;color:#cad4df}.disabled{color:#ffbe66}#searchResults button{display:block}</style>
<header><b>CityNav ↔ OSM 人工控制点</b><select id="city"><option value="cambridge">Cambridge</option><option value="birmingham">Birmingham</option></select><select id="scene"></select><select id="mode"><option value="similarity">相似变换 RANSAC</option><option value="affine">仿射变换 RANSAC</option></select><a href="/" target="_blank">原局部XY诊断页</a><span id="status">加载中…</span></header>
<header><span>新增点类型</span><select id="split"><option value="fit">拟合点（建议≥10）</option><option value="validation">独立验证点（建议≥5）</option></select><select id="source"><option value="public_building_corner">建筑角点</option><option value="public_road_intersection">道路交叉点</option><option value="other_public_feature">其他公开地物</option></select><button id="cancel">取消选择/待配对</button><button id="undo">撤销</button><button id="save">保存并计算误差</button><button id="reload">重新加载</button><button id="export">导出JSON</button><label><input type="checkbox" id="showPoly" checked>具名Polygon</label><label><input type="checkbox" id="showGhost">右图透明叠加正射图（拟合预览）</label><input id="opacity" type="range" min="0" max="1" step=".05" value=".45"></header>
<header><input id="query" placeholder="搜索地名，例如 St John's College Cambridge" size="48"><button id="search">OSM地名搜索</button><span class="small">左侧：局部米制XY；右侧：真实OSM。未拟合前两图不联动、不假设已对齐。</span></header><div id="searchResults"></div>
<div class="maps"><div id="left" class="pane"></div><div id="right" class="pane"></div><svg id="links"></svg></div>
<div class="panel"><div class="small">先点左侧建筑角点，再点右侧同一角点（顺序可反）。编号自动配对；点击表格行可修改该点任一侧，点击取消后新增。蓝色=拟合，紫色=独立验证。保存自动计算；点数不足会保存但不批准配准。青色误差线为预测点→人工OSM点。历史轨迹和目标GT不参与控制点。</div><p id="report">尚无配准</p><div id="rows"><table><thead><tr><th>编号/场景</th><th>用途</th><th>CityNav XY(m)</th><th>OSM lon,lat</th><th>误差(m)</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script src="/vendor/leaflet.js"></script><script>
const $=s=>document.querySelector(s);let city='cambridge',scene,meta,points=[],revision=0,registration=null,selected=null,pending={},history=[],dirty=false,saving=false,timer,ghost=null;
const left=L.map('left',{crs:L.CRS.Simple,minZoom:-4,maxZoom:6}),right=L.map('right').setView([52.208,.12],16);L.tileLayer('/osm/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(right);let image=null,polys=L.layerGroup().addTo(left),lm=L.layerGroup().addTo(left),rm=L.layerGroup().addTo(right),errors=L.layerGroup().addTo(right);const markerRefs=[];
const status=t=>$('#status').textContent=t;function snapshot(){history.push(JSON.stringify(points));if(history.length>50)history.shift()}
async function api(url,options={}){let r=await fetch(url,options);if(!r.ok)throw new Error((await r.text()).slice(0,200));return r.json()}
function queue(){dirty=true;clearTimeout(timer);status('未保存，1秒后自动保存');timer=setTimeout(()=>save().catch(e=>status('保存失败：'+e.message)),1000)}
async function save(){clearTimeout(timer);if(saving){await new Promise(r=>setTimeout(r,100));return save()}if(!dirty)return; saving=true;let captured=JSON.stringify(points);try{let d=await api('/api/controls/'+city,{method:'POST',headers:{'Content-Type':'application/json','X-Control-Write':'1'},body:JSON.stringify({revision,points:JSON.parse(captured),mode:$('#mode').value})});revision=d.revision;registration=d.registration;if(JSON.stringify(points)===captured)dirty=false;status('已保存 v'+revision+' '+d.updated_at);draw();if(dirty)queue()}finally{saving=false}}
async function load(){clearTimeout(timer);let d=await api('/api/controls/'+city);points=d.points;revision=d.revision;registration=d.registration;$('#mode').value=d.mode||'similarity';dirty=false;history=[];selected=null;pending={};draw();status('已恢复 v'+revision+'；'+points.length+'个控制点')}
async function changeScene(){scene=$('#scene').value;meta=await api('/api/scene/'+scene);if(image)left.removeLayer(image);image=L.imageOverlay('/native-raster/'+scene,[[meta.bounds[1],meta.bounds[0]],[meta.bounds[3],meta.bounds[2]]]).addTo(left);image.bringToBack();left.fitBounds(image.getBounds());polys.clearLayers();meta.objects.forEach(o=>L.polygon(o.polygon.map(p=>[p[1],p[0]]),{color:'#ffb839',weight:1,fillOpacity:0}).bindTooltip(o.name).addTo(polys));if(!$('#showPoly').checked)left.removeLayer(polys);selected=null;pending={};draw();ghostUpdate()}
function icon(id,type,chosen){return L.divIcon({className:'cp '+(type||'')+(chosen?' selected':''),html:String(id),iconSize:[24,24],iconAnchor:[12,12]})}
function draw(){lm.clearLayers();rm.clearLayers();errors.clearLayers();markerRefs.length=0;$('#tbody').replaceChildren();let stats=registration?.points||[];
 points.forEach((p,i)=>{let cls=p.split==='validation'?'validation':'';let a=null;if(p.map_name===scene)a=L.marker([p.y,p.x],{icon:icon(i+1,cls,p.id===selected),draggable:true}).addTo(lm).on('click',()=>{selected=p.id;draw()}).on('dragend',e=>{snapshot();let v=e.target.getLatLng();p.x=v.lng;p.y=v.lat;queue();draw()});let b=L.marker([p.lat,p.lon],{icon:icon(i+1,cls,p.id===selected),draggable:true}).addTo(rm).on('click',()=>{selected=p.id;draw()}).on('dragend',e=>{snapshot();let v=e.target.getLatLng();p.lon=v.lng;p.lat=v.lat;queue();draw()});if(a)markerRefs.push([a,b]);let result=stats.find(r=>r.id===p.id);if(result)L.polyline([[result.pred_lat,result.pred_lon],[p.lat,p.lon]],{color:'#00d4e0',weight:2}).addTo(errors);
 let tr=document.createElement('tr');tr.onclick=()=>{selected=p.id;pending={};status('正在修改点'+(i+1)+'：点击任一地图或拖动标记');draw()};let txt=[`${i+1} ${p.map_name}`,p.split==='fit'?'拟合':'独立验证',p.x.toFixed(3)+', '+p.y.toFixed(3),p.lon.toFixed(7)+', '+p.lat.toFixed(7),result?result.error_m.toFixed(3):'待计算'];txt.forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});let td=document.createElement('td'),del=document.createElement('button');del.textContent='删除';del.onclick=e=>{e.stopPropagation();snapshot();points=points.filter(v=>v.id!==p.id);selected=null;queue();draw()};let toggle=document.createElement('button');toggle.textContent='切换用途';toggle.onclick=e=>{e.stopPropagation();snapshot();p.split=p.split==='fit'?'validation':'fit';queue();draw()};td.append(toggle,del);tr.append(td);$('#tbody').append(tr)});
 if(pending.xy)L.marker([pending.xy[1],pending.xy[0]],{icon:icon('?', 'pending')}).addTo(lm);if(pending.ll)L.marker([pending.ll[1],pending.ll[0]],{icon:icon('?', 'pending')}).addTo(rm);
 let fit=points.filter(p=>p.split==='fit').length,val=points.length-fit;$('#report').textContent=`城市 ${city}：${fit}拟合 / ${val}独立验证。`+(registration?.matrix?`\n${registration.mode}；RANSAC内点${registration.ransac_inliers}；独立验证平均${registration.validation.mean_m.toFixed(2)}m / RMSE ${registration.validation.rmse_m.toFixed(2)}m / P95 ${registration.validation.p95_m.toFixed(2)}m / 最大${registration.validation.max_m.toFixed(2)}m。\n${registration.verified?'当前验证点满足5m可视化验收；未验证场景仍不可自动批准':'未通过5m可视化验收'}\n分场景验证：${JSON.stringify(registration.per_map_validation)}`:'\n地理配准未验证：'+(registration?.pending_reason||'请开始标点'));links()}
function clicked(side,e){let p=points.find(p=>p.id===selected);if(p){if(side==='xy'&&p.map_name!==scene){status('请切换到该点所属场景再修改左侧');return}snapshot();if(side==='xy'){p.x=e.latlng.lng;p.y=e.latlng.lat}else{p.lon=e.latlng.lng;p.lat=e.latlng.lat}queue();draw();return}pending[side]=[e.latlng.lng,e.latlng.lat];if(pending.xy&&pending.ll){snapshot();points.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random(),map_name:scene,x:pending.xy[0],y:pending.xy[1],lon:pending.ll[0],lat:pending.ll[1],split:$('#split').value,source:$('#source').value});pending={};queue()}else status('已选一侧，请点击另一地图对应点');draw()}
left.on('click',e=>clicked('xy',e));right.on('click',e=>clicked('ll',e));function links(){let svg=$('#links'),box=svg.getBoundingClientRect();svg.replaceChildren();for(let[a,b]of markerRefs){let p=left.latLngToContainerPoint(a.getLatLng()),q=right.latLngToContainerPoint(b.getLatLng()),l=left.getContainer().getBoundingClientRect(),r=right.getContainer().getBoundingClientRect();if(p.x<0||p.y<0||q.x<0||q.y<0)continue;let line=document.createElementNS('http://www.w3.org/2000/svg','line');for(let[k,v]of Object.entries({x1:p.x+l.left-box.left,y1:p.y+l.top-box.top,x2:q.x+r.left-box.left,y2:q.y+r.top-box.top,stroke:'#ffe887','stroke-width':1,'stroke-opacity':.5}))line.setAttribute(k,v);svg.append(line)}}left.on('move zoom',links);right.on('move zoom',links);
$('#cancel').onclick=()=>{selected=null;pending={};draw()};$('#undo').onclick=()=>{if(history.length){points=JSON.parse(history.pop());pending={};selected=null;queue();draw()}};$('#save').onclick=()=>{dirty=true;save().then(ghostUpdate).catch(e=>status(e.message))};$('#reload').onclick=()=>{if(!dirty||confirm('放弃未保存修改并重新加载？'))load().catch(e=>status(e.message))};$('#export').onclick=async()=>{await save();location.href='/api/controls/'+city+'/export'};$('#mode').onchange=()=>{queue()};$('#scene').onchange=()=>changeScene().catch(e=>status(e.message));$('#city').onchange=async()=>{await save();city=$('#city').value;right.setView(city==='cambridge'?[52.208,.12]:[52.486,-1.9],16);await populate();await load();await changeScene()};$('#showPoly').onchange=()=>$('#showPoly').checked?polys.addTo(left):left.removeLayer(polys);
$('#search').onclick=async()=>{try{status('搜索中…');let r=await api('/api/search?q='+encodeURIComponent($('#query').value));$('#searchResults').replaceChildren();r.forEach(v=>{let b=document.createElement('button');b.textContent=v.display_name;b.onclick=()=>{right.setView([+v.lat,+v.lon],18);$('#searchResults').replaceChildren()};$('#searchResults').append(b)});status(r.length?'请选择地名结果':'无结果，可拖动OSM')}catch(e){status('搜索失败：'+e.message)}};
// Fit preview: affine texture on current Web-Mercator screen. Fourth-corner screen error is shown; not a precise georeferenced raster export.
const Ghost=L.Layer.extend({onAdd(m){this._map=m;this.canvas=L.DomUtil.create('canvas','leaflet-layer');this.canvas.style.pointerEvents='none';m.getPanes().overlayPane.append(this.canvas);m.on('move zoom resize',this.render,this);this.render()},onRemove(m){m.off('move zoom resize',this.render,this);this.canvas.remove()},render(){if(!this._map||!this.img?.complete)return;let m=this._map,s=m.getSize(),c=this.canvas;c.width=s.x;c.height=s.y;L.DomUtil.setPosition(c,m.containerPointToLayerPoint([0,0]));let [a,b,d,e]=this.corners.map(v=>m.latLngToContainerPoint(v)),ctx=c.getContext('2d'),w=this.img.naturalWidth,h=this.img.naturalHeight;ctx.globalAlpha=+$('#opacity').value;ctx.setTransform((b.x-a.x)/w,(b.y-a.y)/w,(e.x-a.x)/h,(e.y-a.y)/h,a.x,a.y);ctx.drawImage(this.img,0,0);this.error=Math.hypot(d.x-(b.x+e.x-a.x),d.y-(b.y+e.y-a.y))}});
async function ghostUpdate(){if(ghost){right.removeLayer(ghost);ghost=null}if(!$('#showGhost').checked)return;try{await save();let d=await api('/api/project-corners/'+city+'/'+scene);ghost=new Ghost();ghost.corners=d.corners;ghost.img=new Image();ghost.img.onload=()=>ghost.render();ghost.img.src='/native-raster/'+scene;ghost.addTo(right);status('正射图拟合预览；'+(d.verified?'验证点通过':'尚未通过独立验证'))}catch(e){status('无法预览：'+e.message)}}$('#showGhost').onchange=ghostUpdate;$('#opacity').oninput=()=>ghost?.render();
async function populate(){let a=await api('/api/maps');$('#scene').replaceChildren();a.filter(m=>m.startsWith(city+'_')).forEach(m=>$('#scene').add(new Option(m,m)));let preferred=city+'_block_3';if(a.includes(preferred))$('#scene').value=preferred}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='尚有未保存控制点'}});(async()=>{await populate();await load();await changeScene()})().catch(e=>status(e.message));
</script></html>

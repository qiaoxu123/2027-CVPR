<!doctype html><meta charset="utf-8"><title>CityNav局部XY地图</title><style>body{font:16px system-ui;background:#17212c;color:#eee;margin:18px}canvas{max-width:95vw;max-height:78vh;background:#eee;cursor:crosshair}select,button{font:inherit;margin:8px}#note{color:#ffcd77}#detail{white-space:pre-wrap}</style><h2>CityNav 局部XY诊断地图</h2><select id="maps"></select><select id="base"><option value="rgb">高清正射RGB</option><option value="heat">Geometry Heatmap</option><option value="plain">局部XY平面</option><option disabled>OSM：地理配准未验证</option></select><label><input id="poly" type="checkbox" checked>公开具名Polygon</label><label><input id="truth" type="checkbox">事后GT</label><p id="note"></p><canvas id="map" width="1000" height="1000"></canvas><p id="detail"></p><script>
let state,img;const c=document.querySelector('canvas'),x=c.getContext('2d'),sel=document.querySelector('#maps');function point(p){let b=state.bounds;return [(p[0]-b[0])/(b[2]-b[0])*c.width,(b[3]-p[1])/(b[3]-b[1])*c.height]}
function line(points,color,width=1,close=false){if(!points?.length)return;x.beginPath();points.forEach((p,i)=>{let q=point(p);i?x.lineTo(...q):x.moveTo(...q)});if(close)x.closePath();x.strokeStyle=color;x.lineWidth=width;x.stroke()}
function draw(){if(!state||!img)return;x.clearRect(0,0,c.width,c.height);x.fillStyle='#eee';x.fillRect(0,0,c.width,c.height);let o=state.overlay,b=document.querySelector('#base').value;if(b==='rgb')x.drawImage(img,0,0,c.width,c.height);if(b==='heat'&&o?.heatmap){let z=o.heatmap,n=z.length,lo=Math.min(...z.flat()),hi=Math.max(...z.flat());z.forEach((r,j)=>r.forEach((v,i)=>{let t=(v-lo)/Math.max(hi-lo,1e-8);x.fillStyle=`rgb(${255*t},${50*t},${100*(1-t)})`;x.fillRect(i*c.width/n,(n-1-j)*c.height/n,c.width/n+1,c.height/n+1)}))}if(document.querySelector('#poly').checked)state.objects.forEach(v=>line(v.polygon,'#ffc83f',1,true));if(o){line(o.trajectory,'#00cfff',2);line(o.footprint,'#fff',2,true);o.candidates?.forEach((p,i)=>{let q=point(p.xy);x.fillStyle='#00ff8a';x.beginPath();x.arc(...q,5,0,7);x.fill();x.fillText(i+1,q[0]+6,q[1])});if(document.querySelector('#truth').checked&&o.target){let q=point(o.target);x.fillStyle='red';x.fillRect(q[0]-5,q[1]-5,10,10)}}}
async function load(){state=await(await fetch('/api/scene/'+sel.value)).json();img=new Image();img.onload=draw;img.src='/raster/'+sel.value;document.querySelector('#note').textContent=state.georegistration+'；栅格与Polygon使用局部米制XY。青线：官方参考轨迹（仅诊断）；绿点：冻结Geometry空间NMS候选。';document.querySelector('#detail').textContent=state.overlay?.instruction||'此场景尚无候选/轨迹叠加缓存。'}
fetch('/api/maps').then(r=>r.json()).then(a=>{a.forEach(m=>sel.add(new Option(m,m)));load()});sel.onchange=load;['base','poly','truth'].forEach(k=>document.querySelector('#'+k).onchange=draw);c.onclick=e=>{if(!state?.overlay)return;let r=c.getBoundingClientRect(),p=[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height],v=state.overlay.candidates.map((v,i)=>({v,i,d:Math.hypot(...point(v.xy).map((q,k)=>q-p[k]))})).sort((a,b)=>a.d-b.d)[0];if(v)document.querySelector('#detail').textContent=JSON.stringify(v,null,2)+'\n'+state.overlay.instruction+'\n候选RGB-D ROI尚未接入；未观察候选不可视作负样本。'};
</script>

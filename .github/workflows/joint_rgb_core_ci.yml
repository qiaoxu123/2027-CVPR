name: Joint RGB Geometry Core CPU Checks

on:
  push:
    branches:
      - research/joint-rgb-geometry-retrain-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-rgb-cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install test environment
        run: python -m pip install -e '.[dev,data]' pyyaml
      - name: Compile modified Python files
        run: |
          python -m compileall -q graphnav/full_localization.py graphnav/joint_rgb_geometry.py graphnav/stage1_checkpoint.py graphnav/stage1_runtime.py scripts/train_graphnav_stage1.py scripts/evaluate_closedloop.py scripts/run_joint_rgb_geometry_core.py
      - name: Run focused joint and legacy tests
        run: python -m pytest -q tests/test_joint_rgb_geometry.py tests/test_stage1.py tests/test_full_token_rgb.py tests/test_stage1_final_evaluation.py

name: One-time GraphNav branch archive and safe pruning
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  archive-prune:
    # Never run during an ordinary push or a later release.
    if: startsWith(github.event.head_commit.message, 'chore(branches): archive redundant GraphNav heads')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify frozen V1 has already entered main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/reports/graphnav_v1_stage1/GRAPHNAV_V1_RESULTS.md?ref=main" >/dev/null
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/1678eb0692fe4154137a22c49bce698e4186a900...main" --jq .status)"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "V1 historical branch is not an ancestor of main: $status" >&2
            exit 1
          fi
      - name: Tag each exact old head before deleting its redundant branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo 'branch,original_sha,archive_tag,result' > branch_archive_results.csv
          while read -r b expected; do
            [[ -n "$b" ]] || continue
            case "$b" in
              main|2027-CVPR/graphnav-relational-visual-belief|research/multiview-rgb-grounding-20261011|backup/*)
                echo "Refusing to delete preserved ref: $b" >&2
                exit 1;;
            esac
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$b" --jq .object.sha 2>/dev/null || true)"
            if [[ "$current" != "$expected" ]]; then
              echo "$b,$expected,,SKIPPED_CHANGED_OR_MISSING" >> branch_archive_results.csv
              echo "Skipping $b because the expected old head was not found"
              continue
            fi
            slug="${b//\//--}"
            tag="archive/graphnav-20261011/$slug"
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
            if [[ -z "$existing" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected" >/dev/null
              existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq .object.sha)"
            fi
            if [[ "$existing" != "$expected" ]]; then
              echo "Tag mismatch for $b, refusing deletion" >&2
              exit 1
            fi
            # Recheck branch sha immediately before delete; abort on movement.
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$b" --jq .object.sha)"
            if [[ "$latest" != "$expected" ]]; then
              echo "$b,$expected,$tag,SKIPPED_MOVED_AFTER_TAG" >> branch_archive_results.csv
              continue
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" >/dev/null
            echo "$b,$expected,$tag,ARCHIVED_AND_DELETED" >> branch_archive_results.csv
            echo "Archived and deleted: $b"
          done <<'BRANCHES'
          2027-CVPR/graphnav-closedloop-sbf-parity 64294e3ad9764f7ba1a9a18d8c1dad7cf276c8ea
          2027-CVPR/semantic-geometry-localization 4d6c81c2395505fb4473a08383d0476576acd776
          integration/graphnav-v1-main-20261011 b3018e7b9e9f0766243b16a9e86637408f8fcea7
          maintenance/main-release-audit-20261011 141c940d4f9e4fe770e5326507ee3c62963e18e3
          research/active-view-selection-20261011 043d3897a97af8f35ee60889fa3640f59393c4ad
          research/instance-rgb-grounding-20261011 06ebf5398d051ecfc105298821ce3b12eced0131
          research/rgb-feasibility-20261011 62044c124c2a188e15358cd8c412115c04209590
          research/rgb-language-grounding-20261010 350f99d3a55d305969f934e31fea6faf08d05fe8
          research/visual-goal-association-20261011 4a69bdf73fabaa931ee92354b52eb6672430ccd3
          validation/bidirectional-p0-p2-local-20261009 11e0409b322f08db4459888c6d38ba08547da730
          validation/full-token-rgb-local-20261009 8a75d9ed5396933f89492624360a3c2a9e8b530f
          validation/static-geometry-20261009 e6344eac1c6d03307af43b187a0cf927f01bdf7e
          BRANCHES
          cat branch_archive_results.csv
      - name: Save archival manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphnav-branch-archive-20261011
          path: branch_archive_results.csv
          if-no-files-found: warn

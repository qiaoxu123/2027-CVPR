name: GraphNav CPU Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install GraphNav
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Smoke training
        run: |
          python -m graphnav.train --smoke --epochs 1 --steps 2 --device cpu \
            --grid-size 4 --max-landmarks 3 --top-k 3 --hidden 32 \
            --text-dim 16 --waypoints 3 --batch-size 2 \
            --output runs/ci/smoke.pt

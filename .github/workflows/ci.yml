name: GraphNav CPU CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install offline test dependencies
        run: python -m pip install -e '.[dev,data]' pyyaml
      - name: Syntax check
        run: python -m compileall -q graphnav scripts experiments tests
      - name: Unit and integration tests (no dataset download)
        run: python -m pytest -q
      - name: Synthetic CPU smoke (not CityNav navigation)
        run: |
          python -m graphnav.train --smoke --epochs 1 --steps 2 --device cpu \
            --grid-size 4 --max-landmarks 3 --top-k 3 --hidden 32 \
            --text-dim 16 --waypoints 3 --batch-size 2 \
            --output runs/ci/smoke.pt


  unified-v2-cpu-tests:
    name: UnifiedPGVB-v2 language / geometry / single-vision CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install core and testing dependencies
        run: python -m pip install -e '.[dev,data]' pyyaml
      - name: Test V2 geometry ownership, language, checkpoint and RGB sharing
        run: |
          python -m pytest -q tests/test_stable_navigation_goal.py \
            tests/test_landmark_acquisition.py \
            tests/test_landmark_neighborhood.py \
            tests/test_unified_instruction.py \
            tests/test_unified_pgvb.py \
            tests/test_unified_pgvb_v2.py \
            tests/test_pgvb_navigation_runtime.py
